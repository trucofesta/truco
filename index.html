<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links e Números</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen flex items-center justify-center">

  <div class="bg-white p-6 rounded-2xl shadow-2xl w-full max-w-md space-y-6">
    <h1 class="text-2xl font-bold text-center">📂 Meus Dados</h1>

    <!-- LINKS -->
    <div>
      <h2 class="font-semibold mb-2 text-gray-700">Links</h2>
      <ul id="linksList" class="space-y-2"></ul>
    </div>

    <!-- NÚMEROS -->
    <div>
      <h2 class="font-semibold mb-2 text-gray-700">Números</h2>
      <ul id="numbersList" class="space-y-2"></ul>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-black text-white px-4 py-2 rounded opacity-0 transition">
    Copiado!
  </div>

  <script>
    const links = [
      "https://bets.atlantispayments.com.br/",
      "https://otanpay.space",
      "https://realfesta.onelink.me/W988/nw61jay1",
      "https://sms24h.org"
    ];

    const numeros = [
      "1 - 72691131815",
      "2 - 34960900814",
      "3 - 40633586749",
      "4 - 76343596453",
      "5 - 63766400959",
      "6 - 03126425631",
      "7 - 03527291636",
      "8 - 20564007587",
      "9 - 11093755814",
      "10 - 60855975172",
      "11 - 51658321472",
      "12 - 19823065802",
      "13 - 48144746449",
      "14 - 17892520325",
      "15 - 37819127872",
      "16 - 00908280386",
      "17 - 05303423409",
      "18 - 97824291553",
      "19 - 55753299504",
      "20 - 01185821864",
      "21 - 52242099353",
      "22 - 52257037391"
    ];

    function showToast() {
      const toast = document.getElementById('toast');
      toast.style.opacity = '1';
      setTimeout(() => {
        toast.style.opacity = '0';
      }, 1500);
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      showToast();
    }

    function renderLinks() {
      const list = document.getElementById('linksList');
      list.innerHTML = '';

      links.forEach(link => {
        const li = document.createElement('li');
        li.className = 'p-3 bg-gray-50 rounded-xl flex justify-between items-center hover:shadow transition';

        li.innerHTML = `
          <a href="${link}" target="_blank" class="text-blue-600 underline truncate w-2/3">${link}</a>
          <button onclick="copyText('${link}')" class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded-lg">Copiar</button>
        `;

        list.appendChild(li);
      });
    }

    function renderNumbers() {
      const list = document.getElementById('numbersList');
      list.innerHTML = '';

      numeros.forEach(num => {
        const li = document.createElement('li');
        li.className = 'p-3 bg-gray-50 rounded-xl flex justify-between items-center cursor-pointer hover:shadow transition';

        li.onclick = () => copyText(num);

        li.innerHTML = `
          <span class="text-gray-800">${num}</span>
          <span class="text-sm text-gray-400">(clique para copiar)</span>
        `;

        list.appendChild(li);
      });
    }

    renderLinks();
    renderNumbers();
  </script>

</body>
</html>
